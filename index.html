<!doctype html>
<!--
  PRACTICE PAGE — Stage 1 of the Job Application Assistant App.
  A web page has three parts, all in this one file:
    1. HTML  (the content: headings, boxes, buttons)       -> inside <body>
    2. CSS   (the look: colors, spacing, fonts)             -> inside <style>
    3. JavaScript (the behavior: what happens on a click)   -> inside <script>
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- This line makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Match Practice</title>

  <style>
    /* ---------- CSS: THE LOOK ---------- */

    /* Colors are kept in one place so they are easy to change */
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5b6475;
      --accent: #1f5fbf;      /* blue, for "match" */
      --gap: #b4521c;         /* orange, for "missing" */
      --border: #dde1e8;
    }
    /* Dark colors, used automatically when the phone is in dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e8ebf0;
        --muted: #9aa3b2;
        --accent: #6ea8ff;
        --gap: #f08a52;
        --border: #2c3340;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;                 /* space at the screen edges on phones */
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main { max-width: 640px; margin: 0 auto; }   /* keeps lines readable on big screens */

    h1 { font-size: 1.6rem; margin: 8px 0 4px; }
    .lead { color: var(--muted); margin: 0 0 20px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { font-weight: 400; color: var(--muted); font-size: 0.9rem; }

    textarea, input {
      width: 100%;
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
    }
    textarea { min-height: 160px; resize: vertical; }

    button {
      width: 100%;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { color: #0b1a33; } }

    .score { font-size: 2.4rem; font-weight: 700; margin: 0; }
    .tag {
      display: inline-block;
      padding: 2px 10px;
      margin: 0 6px 6px 0;
      border-radius: 999px;
      font-size: 0.9rem;
      border: 1px solid currentColor;
    }
    .tag.found { color: var(--accent); }
    .tag.missing { color: var(--gap); }
    .hidden { display: none; }
    footer { color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>

<body>
  <!-- ---------- HTML: THE CONTENT ---------- -->
  <main>
    <h1>Job Match Practice</h1>
    <p class="lead">
      Paste a job advert and list your skills. The page counts how many of
      your skills the advert mentions. No AI yet: this is a practice page.
    </p>

    <!-- Box 1: what the user types in -->
    <section class="card">
      <label for="advert">Job advert</label>
      <textarea id="advert" placeholder="Paste the full job advert here..."></textarea>

      <label for="skills">
        Your skills <span class="hint">(separate them with commas)</span>
      </label>
      <input id="skills" placeholder="e.g. Excel, reporting, project management">

      <button id="check">Check my match</button>
    </section>

    <!-- Box 2: the result. Hidden until the button is pressed. -->
    <section class="card hidden" id="result" aria-live="polite">
      <p class="score" id="score"></p>
      <p id="summary"></p>
      <div id="found"></div>
      <div id="missing"></div>
    </section>

    <footer>Practice page · Stage 1 · Everything stays on your device</footer>
  </main>

  <script>
    // ---------- JavaScript: THE BEHAVIOR ----------

    // 1. Find the parts of the page we need to work with
    const button  = document.getElementById("check");
    const advert  = document.getElementById("advert");
    const skills  = document.getElementById("skills");
    const result  = document.getElementById("result");

    // 2. Say what should happen when the button is clicked
    button.addEventListener("click", function () {
      const advertText = advert.value.toLowerCase();

      // Turn "Excel, reporting , SQL" into a clean list: ["excel", "reporting", "sql"]
      const skillList = skills.value
        .split(",")
        .map(s => s.trim())
        .filter(s => s.length > 0);

      // Stop early if something is missing, and tell the user what to do
      if (advertText.trim() === "" || skillList.length === 0) {
        alert("Please paste a job advert and enter at least one skill.");
        return;
      }

      // 3. Sort each skill into "found in the advert" or "not mentioned"
      const found = skillList.filter(s => advertText.includes(s.toLowerCase()));
      const missing = skillList.filter(s => !advertText.includes(s.toLowerCase()));

      // 4. Work out a score out of 10 (same scale the real app will use)
      const score = Math.round((found.length / skillList.length) * 10);

      // 5. Show the result on the page
      document.getElementById("score").textContent = score + " / 10";
      document.getElementById("summary").textContent =
        "The advert mentions " + found.length + " of your " + skillList.length + " skills.";
      document.getElementById("found").innerHTML = makeTags(found, "found");
      document.getElementById("missing").innerHTML = makeTags(missing, "missing");
      result.classList.remove("hidden");
    });

    // Helper: turns a list of words into colored "pill" labels
    function makeTags(list, kind) {
      return list
        .map(word => '<span class="tag ' + kind + '">' + escapeText(word) + '</span>')
        .join("");
    }

    // Safety: makes sure typed text is shown as plain text, never run as code
    function escapeText(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
